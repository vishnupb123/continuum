services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-continuum}
      POSTGRES_USER: ${POSTGRES_USER:-continuum}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-continuum}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-continuum} -d ${POSTGRES_DB:-continuum}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://continuum:continuum@postgres:5432/continuum}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AUDIO_STORAGE_BACKEND: ${AUDIO_STORAGE_BACKEND:-local}
      AUDIO_STORAGE_PATH: ${AUDIO_STORAGE_PATH:-/data/audio}

      # Transcription
      TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TRANSCRIPTION_MODEL: ${OPENAI_TRANSCRIPTION_MODEL:-gpt-transcribe}

    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "
      alembic -c /app/alembic.ini upgrade head &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
      "
    volumes:
      - ./apps/api:/app
      - audio_data:/data/audio

  worker:
    build:
      context: ./apps/api
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://continuum:continuum@postgres:5432/continuum}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      AUDIO_STORAGE_BACKEND: ${AUDIO_STORAGE_BACKEND:-local}
      AUDIO_STORAGE_PATH: ${AUDIO_STORAGE_PATH:-/data/audio}
      
      # Transcription
      TRANSCRIPTION_PROVIDER: ${TRANSCRIPTION_PROVIDER:-mock}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_TRANSCRIPTION_MODEL: ${OPENAI_TRANSCRIPTION_MODEL:-gpt-transcribe}

      LOCAL_WHISPER_MODEL: ${LOCAL_WHISPER_MODEL:-small.en}
      LOCAL_WHISPER_DEVICE: ${LOCAL_WHISPER_DEVICE:-cpu}
      LOCAL_WHISPER_COMPUTE_TYPE: ${LOCAL_WHISPER_COMPUTE_TYPE:-int8}
      LOCAL_WHISPER_DOWNLOAD_ROOT: ${LOCAL_WHISPER_DOWNLOAD_ROOT:-/models}


    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      api:
        condition: service_started
    command:
        - celery
        - -A
        - app.tasks.celery_app.celery_app
        - worker
        - --loglevel=info
        - --concurrency=1
    volumes:
      - ./apps/api:/app
      - audio_data:/data/audio
      - whisper_models:/models

  web:
    build:
      context: ./apps/web
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - api
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
  audio_data:
  whisper_models: